<body>
<div class="toolbar">
  <label><input type="checkbox" id="dark"> Dark theme</label>
  <label>Language
    <select id="lang"><option>en</option><option>cs</option><option>sk</option><option>de</option></select>
  </label>
  <label>Time format
    <select id="tf"><option value="24">24 h</option><option value="12">12 h</option></select>
  </label>
</div>
<div class="grid" id="grid"></div>
<script>
const MIN = 60000;

/** Attributes of a route_name sensor, as the integration publishes them. */
function departure(now, d) {
  const delay = d.delay ?? 0;
  const iso = (min) => new Date(now + min * MIN).toISOString();
  return {
    arrival_time_est: null, arrival_time_sched: null,
    departure_time_est: iso(d.in + delay / 60), departure_time_sched: iso(d.in), departure_in_min: "",
    is_delay_avail: d.realtime !== false, delay_min: Math.floor(delay / 60), delay_sec: delay,
    route_name: d.line, route_type: d.type || "bus", train_number: d.train || null,
    trip_id: "demo", trip_direction: null, trip_headsign: d.to,
    is_air_conditioned: !!d.ac, is_at_stop: !!d.atStop, is_canceled: !!d.canceled, is_night: !!d.night,
    is_regional: false, is_substitute: !!d.substitute, is_wheelchair_accessible: !!d.wheelchair,
    last_stop_id: null, last_stop_name: null, stop_id: "U0", stop_platform: d.platform || null,
    latitude: 50.08, longitude: 14.43,
  };
}

/** A hass object with departure board devices, their entities and states. */
function mockHass(boards, { language = "en", timeFormat = "24", staleMinutes = 0 } = {}) {
  const now = Date.now();
  const entities = {}, devices = {}, states = {};
  const add = (entityId, deviceId, key, state, attributes = {}) => {
    entities[entityId] = { entity_id: entityId, device_id: deviceId, platform: "pid_departures", translation_key: key };
    states[entityId] = { entity_id: entityId, state, attributes };
  };
  boards.forEach((board, b) => {
    const deviceId = board.id;
    devices[deviceId] = { id: deviceId, name: board.name };
    board.departures.forEach((d, i) => {
      add(`sensor.${deviceId}_next_route_name_${i + 1}`, deviceId, "route_name", d.line, departure(now, d));
    });
    add(`binary_sensor.${deviceId}_infotext`, deviceId, "infotext", board.infotext ? "on" : "off",
      board.infotext ? { text: board.infotext.cs, text_en: board.infotext.en } : {});
    add(`sensor.${deviceId}_updated`, deviceId, "updated", new Date(now - staleMinutes * MIN).toISOString());
  });
  return {
    entities, devices, states, language,
    locale: { language, time_format: timeFormat, time_zone: "local" },
    config: { time_zone: "Europe/Prague" },
  };
}

const BOARDS = [
  { id: "plananska_a", name: "Plaňanská A", departures: [
    { line: "188", to: "Kavčí hory", in: 0.4, atStop: true, wheelchair: true, ac: true },
    { line: "199", to: "Sídliště Malešice", in: 4, delay: 120, wheelchair: true },
    { line: "133", to: "Sídliště Malešice přes Nádraží Strašnice", in: 9, wheelchair: true, ac: true },
    { line: "188", to: "Kavčí hory", in: 13, realtime: false },
    { line: "X913", to: "Černý Most", in: 3, delay: 720, wheelchair: true, substitute: true },
    { line: "22", type: "tram", to: "Bílá Hora", in: 6, delay: -60 },
    { line: "X9", to: "Náměstí Míru", in: 21, substitute: true, canceled: true },
    { line: "913", to: "Sídliště Ďáblice", in: 95, night: true, wheelchair: true },
  ] },
  { id: "palmovka_a", name: "Palmovka A",
    infotext: {
      cs: "Z důvodu opravy trati jsou tramvaje linky 3 odkloněny přes zastávku Libeňský most.",
      en: "Due to track works, tram line 3 is diverted via Libeňský most.",
    },
    departures: [
      { line: "B", type: "metro", to: "Černý Most", in: 1, platform: "M1", wheelchair: true },
      { line: "8", type: "tram", to: "Starý Hloubětín", in: 3, delay: 60, platform: "A", wheelchair: true, ac: true },
      { line: "12", type: "tram", to: "Lehovec", in: 7, platform: "A", wheelchair: true },
    ] },
  { id: "palmovka_b", name: "Palmovka B", departures: [
    { line: "B", type: "metro", to: "Zličín", in: 2, platform: "M2", wheelchair: true },
    { line: "S9", type: "train", train: "Os 9362", to: "Praha hl.n.", in: 6, platform: "B" },
    { line: "C", type: "metro", to: "Háje", in: 8, platform: "M" },
    { line: "58", type: "trolleybus", to: "Letňany", in: 14, platform: "B", wheelchair: true, ac: true },
  ] },
];

const SCENARIOS = [
  { title: "Wide card (480 px)", width: 480, config: { devices: ["plananska_a"] } },
  { title: "Two platforms merged", config: { devices: ["palmovka_a", "palmovka_b"] } },
  { title: "Compact, stale data", config: { devices: ["plananska_a"], compact: true }, staleMinutes: 12 },
  { title: "Time only", config: { devices: ["palmovka_a", "palmovka_b"], time_format: "absolute" } },
  { title: "Countdown only", config: { devices: ["plananska_a"], time_format: "relative" } },
  { title: "Medium card (400 px)", width: 400, config: { devices: ["plananska_a"] } },
  { title: "Narrow card (300 px)", width: 300, config: { devices: ["plananska_a"] } },
  { title: "No board selected", config: {} },
];

const cards = [];
for (const s of SCENARIOS) {
  const wrapper = document.createElement("div");
  wrapper.className = "demo";
  if (s.width) wrapper.style.width = `${s.width}px`;
  wrapper.innerHTML = `<h4>${s.title}</h4>`;
  const card = document.createElement("pid-departures-card");
  card.setConfig({ type: "custom:pid-departures-card", ...s.config });
  wrapper.append(card);
  document.getElementById("grid").append(wrapper);
  cards.push({ card, scenario: s });
}

function update() {
  document.body.classList.toggle("dark", document.getElementById("dark").checked);
  for (const { card, scenario } of cards) {
    card.hass = mockHass(BOARDS, {
      language: document.getElementById("lang").value,
      timeFormat: document.getElementById("tf").value,
      staleMinutes: scenario.staleMinutes,
    });
  }
}
document.querySelectorAll(".toolbar input, .toolbar select").forEach((el) => el.addEventListener("change", update));
document.addEventListener("hass-more-info", (ev) => console.log("more-info", ev.detail.entityId));
update();
</script>
</body>
